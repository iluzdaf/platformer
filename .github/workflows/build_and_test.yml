name: Build and Test

on:
  pull_request:
    branches: [master]
  push:
    # Only to fill the compiler caches. A branch can restore caches from itself
    # and from the default branch, so without a run here every new branch starts
    # cold on all four of them, Windows sccache included.
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      DISPLAY: ":99"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ runner.os == 'Linux' }}
          submodules: false

      - name: Name the submodules by what they are pinned to
        shell: bash
        run: echo "EXTERNAL=$(git rev-parse HEAD:external)" >> "$GITHUB_ENV"

      - name: Restore submodules
        id: submodules
        uses: actions/cache@v6
        with:
          path: |
            external
            .git/modules
          key: submodules-${{ runner.os }}-${{ env.EXTERNAL }}

      - name: Fetch submodules
        if: steps.submodules.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --recursive

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/.sccache
          key: ccache-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-build-${{ runner.os }}-

      - name: Set up for Linux
        if: runner.os == 'Linux'
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM"
          sudo apt-get install -y \
            clang-$LLVM \
            clang-tidy-$LLVM \
            clang-format-$LLVM \
            libc++-$LLVM-dev \
            libc++abi-$LLVM-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ccache
          Xvfb :99 -screen 0 1024x768x24 &

      - name: Set up for macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm ccache || {
            brew update
            brew install llvm ccache
          }

      - name: Set up for Windows
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install sccache for Windows
        if: runner.os == 'Windows'
        run: choco install sccache --no-progress

      - name: Configure & Build for Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -G "Ninja" -B build/release ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DSKIP_OPENGL_TESTS=ON
          cmake --build build/release

      - name: Compiler cache stats for Windows
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: |
          sccache --show-stats
          sccache --stop-server

      - name: Configure & Build for macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cmake -G Ninja -B build/release \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DGLFW_BUILD_WAYLAND=OFF \
              -DCMAKE_C_COMPILER=/usr/bin/clang-${LLVM} \
              -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${LLVM} \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
              -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cmake -G Ninja -B build/release \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_COMPILER="/opt/homebrew/opt/llvm/bin/clang" \
              -DCMAKE_CXX_COMPILER="/opt/homebrew/opt/llvm/bin/clang++" \
              -DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path) \
              -DSKIP_OPENGL_TESTS=ON
          fi

          cmake --build build/release --config Release

      - name: Run tests for Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build/release
        run: tests.exe

      - name: Run tests for macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/release
          ./tests

  checks:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Name the submodules by what they are pinned to
        run: echo "EXTERNAL=$(git rev-parse HEAD:external)" >> "$GITHUB_ENV"

      - name: Restore submodules
        id: submodules
        uses: actions/cache@v6
        with:
          path: |
            external
            .git/modules
          key: submodules-${{ runner.os }}-${{ env.EXTERNAL }}

      - name: Fetch submodules
        if: steps.submodules.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Check json assets are formatted
        run: python3 tools/format_json.py --check

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-checks-${{ github.sha }}
          restore-keys: |
            ccache-checks-
            ccache-build-Linux-

      - name: Set up LLVM
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM"
          sudo apt-get install -y \
            clang-$LLVM \
            clang-tidy-$LLVM \
            clang-format-$LLVM \
            libc++-$LLVM-dev \
            libc++abi-$LLVM-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ccache

      - name: Check sources are formatted
        run: |
          clang-format-"${LLVM}" --dry-run --Werror \
            $(find src include tests -name '*.cpp' -o -name '*.hpp')

      - name: Configure
        run: |
          cmake -G Ninja -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_C_COMPILER=/usr/bin/clang-${LLVM} \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${LLVM} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"

      - name: Check headers stand on their own
        run: cmake --build build/release --target header_self_containment

      # Strict status checks mean a branch is up to date before it merges, so
      # master is already carrying the verdict this step would repeat.
      - name: Check naming and includes
        if: github.event_name != 'push'
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$SINCE" ]; then
            TARGETS=$(python3 tools/tidy_targets.py --since "$SINCE")
          else
            TARGETS=$(python3 tools/tidy_targets.py)
          fi

          if [ -z "$TARGETS" ]; then
            echo "Nothing reaches the sources that changed."
            exit 0
          fi

          echo "$TARGETS" | wc -l | xargs printf '%s translation units to check\n'
          echo "$TARGETS" \
            | xargs -P"$(nproc)" -n1 clang-tidy-"${LLVM}" -p build/release --warnings-as-errors='*' --quiet
