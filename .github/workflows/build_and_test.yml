name: Build and Test

on:
  pull_request:
    branches: [master]
  push:
    # Only to fill the compiler caches. A branch can restore caches from itself
    # and from the default branch, so without a run here every new branch starts
    # cold on all four of them, Windows sccache included.
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      DISPLAY: ":99"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      CACHE_TOOL: ${{ matrix.os == 'windows-latest' && 'sccache' || 'ccache' }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ runner.os == 'Linux' }}
          submodules: false

      - name: Name the submodules by what they are pinned to
        id: external
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"

      - name: Restore submodules
        id: submodules
        uses: actions/cache@v6
        with:
          path: |
            external
            .git/modules
          key: submodules-${{ runner.os }}-${{ steps.external.outputs.commit }}

      - name: Fetch submodules
        if: steps.submodules.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --recursive

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/.sccache
          key: ccache-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-build-${{ runner.os }}-

      - name: Set up for Linux
        if: runner.os == 'Linux'
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM"
          sudo apt-get install -y \
            clang-$LLVM \
            clang-tidy-$LLVM \
            clang-format-$LLVM \
            libc++-$LLVM-dev \
            libc++abi-$LLVM-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ccache
          Xvfb :99 -screen 0 1024x768x24 &

      - name: Set up for macOS
        if: runner.os == 'macOS'
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          brew install "llvm@$LLVM" ccache || {
            brew update
            brew install "llvm@$LLVM" ccache
          }

      - name: Set up for Windows
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install sccache for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content .sccache-version).Trim()
          $name = "sccache-v$version-x86_64-pc-windows-msvc"
          Invoke-WebRequest `
            "https://github.com/mozilla/sccache/releases/download/v$version/$name.zip" `
            -OutFile "$env:RUNNER_TEMP\sccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure for Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -G "Ninja" -B build/release ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DSKIP_OPENGL_TESTS=ON

      - name: Configure for macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cmake -G Ninja -B build/release \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DGLFW_BUILD_WAYLAND=OFF \
              -DCMAKE_C_COMPILER=/usr/bin/clang-${LLVM} \
              -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${LLVM} \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
              -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cmake -G Ninja -B build/release \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_COMPILER="$(brew --prefix llvm@${LLVM})/bin/clang" \
              -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@${LLVM})/bin/clang++" \
              -DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path) \
              -DSKIP_OPENGL_TESTS=ON
          fi

      - name: Reset compiler cache stats for platformer
        shell: bash
        run: |
          "$CACHE_TOOL" --zero-stats

      - name: Build platformer for Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build build/release --config Release --target platformer

      - name: Build platformer for macOS and Linux
        if: runner.os != 'Windows'
        run: cmake --build build/release --config Release --target platformer

      - name: Show compiler cache stats for platformer
        shell: bash
        run: |
          {
            echo '### Compiler cache: platformer'
            echo
            echo '```text'
            "$CACHE_TOOL" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reset compiler cache stats for tests
        shell: bash
        run: |
          "$CACHE_TOOL" --zero-stats

      - name: Build tests for Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build build/release --config Release --target tests

      - name: Build tests for macOS and Linux
        if: runner.os != 'Windows'
        run: cmake --build build/release --config Release --target tests

      - name: Show compiler cache stats for tests
        shell: bash
        run: |
          {
            echo '### Compiler cache: tests'
            echo
            echo '```text'
            "$CACHE_TOOL" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Enabled while investigating warm-cache build times. Set the repository
      # Actions variable CAPTURE_NINJA_TIMINGS=false to stop collecting artifacts.
      - name: Preserve Windows build timings
        if: always() && runner.os == 'Windows' && vars.CAPTURE_NINJA_TIMINGS != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ninja-timings-Windows-${{ github.run_attempt }}
          path: build/release/.ninja_log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Stop sccache
        if: always() && runner.os == 'Windows'
        shell: bash
        run: sccache --stop-server

      - name: Run tests for Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build/release
        run: tests.exe

      - name: Run tests for macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/release
          ./tests

  coverage:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CACHE_TOOL: ccache

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: false

      - name: Name the submodules by what they are pinned to
        id: external
        run: echo "commit=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"

      - name: Restore submodules
        id: submodules
        uses: actions/cache@v6
        with:
          path: |
            external
            .git/modules
          key: submodules-${{ runner.os }}-${{ steps.external.outputs.commit }}

      - name: Fetch submodules
        if: steps.submodules.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-coverage-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-coverage-${{ runner.os }}-

      - name: Set up for Linux
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM"
          sudo apt-get install -y \
            clang-$LLVM \
            libc++-$LLVM-dev \
            libc++abi-$LLVM-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ccache
          Xvfb :99 -screen 0 1024x768x24 &

      - name: Configure instrumented build
        run: |
          cmake -G Ninja -B build/coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCOVERAGE=ON \
            -DDEAD_CODE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_C_COMPILER=/usr/bin/clang-${LLVM} \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${LLVM} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"

      - name: Reset compiler cache stats for instrumented platformer
        run: |
          "$CACHE_TOOL" --zero-stats

      - name: Build instrumented platformer
        run: cmake --build build/coverage --target platformer

      - name: Show compiler cache stats for instrumented platformer
        run: |
          {
            echo '### Compiler cache: instrumented platformer'
            echo
            echo '```text'
            "$CACHE_TOOL" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reset compiler cache stats for instrumented tests
        run: |
          "$CACHE_TOOL" --zero-stats

      - name: Build instrumented tests
        run: cmake --build build/coverage --target tests

      - name: Show compiler cache stats for instrumented tests
        run: |
          {
            echo '### Compiler cache: instrumented tests'
            echo
            echo '```text'
            "$CACHE_TOOL" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say what the tests never run
        env:
          DISPLAY: ":99"
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            python3 tools/coverage.py build/coverage --files
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say what nothing calls, and what only the tests call
        run: |
          {
            echo '### Functions no binary keeps, and functions only the tests keep'
            echo
            echo '```'
            python3 tools/dead_code.py build/coverage
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CACHE_TOOL: ccache

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Name the submodules by what they are pinned to
        id: external
        run: echo "commit=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"

      - name: Restore submodules
        id: submodules
        uses: actions/cache@v6
        with:
          path: |
            external
            .git/modules
          key: submodules-${{ runner.os }}-${{ steps.external.outputs.commit }}

      - name: Fetch submodules
        if: steps.submodules.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Check json assets are formatted
        run: python3 tools/format_json.py --check

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-checks-${{ github.sha }}
          restore-keys: |
            ccache-checks-
            ccache-build-Linux-

      - name: Set up LLVM
        run: |
          LLVM=$(cat .llvm-version)
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM"
          sudo apt-get install -y \
            clang-$LLVM \
            clang-tidy-$LLVM \
            clang-format-$LLVM \
            libc++-$LLVM-dev \
            libc++abi-$LLVM-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ccache

      - name: Check sources are formatted
        run: |
          clang-format-"${LLVM}" --dry-run --Werror \
            $(find src include tests -name '*.cpp' -o -name '*.hpp')

      - name: Configure
        run: |
          cmake -G Ninja -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_C_COMPILER=/usr/bin/clang-${LLVM} \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${LLVM} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"

      - name: Reset compiler cache stats for header self-containment
        run: |
          "$CACHE_TOOL" --zero-stats

      - name: Check headers stand on their own
        run: cmake --build build/release --target header_self_containment

      - name: Show compiler cache stats for header self-containment
        run: |
          {
            echo '### Compiler cache: header self-containment'
            echo
            echo '```text'
            "$CACHE_TOOL" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Strict status checks mean a branch is up to date before it merges, so
      # master is already carrying the verdict this step would repeat.
      - name: Check naming and includes
        if: github.event_name != 'push'
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$SINCE" ]; then
            TARGETS=$(python3 tools/tidy_targets.py --since "$SINCE")
          else
            TARGETS=$(python3 tools/tidy_targets.py)
          fi

          if [ -z "$TARGETS" ]; then
            echo "Nothing reaches the sources that changed."
            exit 0
          fi

          echo "$TARGETS" | wc -l | xargs printf '%s translation units to check\n'
          echo "$TARGETS" \
            | xargs -P"$(nproc)" -n1 clang-tidy-"${LLVM}" -p build/release --warnings-as-errors='*' --quiet
